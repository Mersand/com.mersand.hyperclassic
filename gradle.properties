# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ★ v2.1.0：AGP 9.1.0 的 release 资源优化在本项目会「假成功」——
# optimizeReleaseResources 报 SUCCESS，但 optimized_processed_res/ 下
# 只有 output-metadata.json，没有任何 .ap_ 产物；packageRelease 因此拿
# 不到资源，打出的 release APK 连 AndroidManifest.xml 和 resources.arsc
# 都没有，装上必失败。
# 关闭新资源优化管线，让 release 走和 debug 相同的打包路径。
android.enableResourceOptimizations=false
android.enableAppCompileTimeRClass=false
